
name: ZIPPEDDON Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android:
    name: ZIPPEDDON Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate artwork
        run: python scripts/generate_assets.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS platform scaffolding
        run: |
          flutter create \
            --platforms=android,ios \
            --org com.anonymousbeta \
            .

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1"

      - name: Verify Android SDK
        run: |
          command -v sdkmanager
          sdkmanager --version
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Force Android API 36 across project and plugins
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          roots = [
              Path("android"),
              Path.home() / ".pub-cache" / "hosted",
              Path.home() / ".pub-cache" / "git",
          ]

          candidates = set()

          for root in roots:
              if not root.exists():
                  continue

              for pattern in ("build.gradle", "build.gradle.kts"):
                  candidates.update(root.rglob(pattern))

          changed = []

          patterns = [
              re.compile(
                  r"(?m)^([ \t]*compileSdkVersion[ \t]+)"
                  r"(?:flutter\.compileSdkVersion|\d+)"
              ),
              re.compile(
                  r"(?m)^([ \t]*compileSdk[ \t]*=[ \t]*)"
                  r"(?:flutter\.compileSdkVersion|\d+)"
              ),
              re.compile(
                  r"(?m)^([ \t]*compileSdk[ \t]+)"
                  r"(?:flutter\.compileSdkVersion|\d+)"
              ),
          ]

          for file in candidates:
              try:
                  original = file.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue

              updated = original

              for pattern in patterns:
                  updated = pattern.sub(
                      lambda match: match.group(1) + "36",
                      updated
                  )

              if updated != original:
                  file.write_text(updated, encoding="utf-8")
                  changed.append(str(file))

          print("Android Gradle files updated:")
          for file in changed:
              print(" -", file)

          app_gradle = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          app_file = next(
              (file for file in app_gradle if file.exists()),
              None
          )

          if app_file is None:
              sys.exit("ERROR: Android app Gradle file not found.")

          content = app_file.read_text(encoding="utf-8")

          app_patterns = [
              re.compile(
                  r"(?m)^([ \t]*compileSdkVersion[ \t]+)"
                  r"(?:flutter\.compileSdkVersion|\d+)"
              ),
              re.compile(
                  r"(?m)^([ \t]*compileSdk[ \t]*=[ \t]*)"
                  r"(?:flutter\.compileSdkVersion|\d+)"
              ),
              re.compile(
                  r"(?m)^([ \t]*compileSdk[ \t]+)"
                  r"(?:flutter\.compileSdkVersion|\d+)"
              ),
          ]

          for pattern in app_patterns:
              content = pattern.sub(
                  lambda match: match.group(1) + "36",
                  content
              )

          app_file.write_text(content, encoding="utf-8")

          print(f"Configured application module: {app_file}")
          PY

      - name: Verify Android API configuration
        shell: bash
        run: |
          echo "Application Gradle configuration:"
          grep -nE 'compileSdk(Version)?' android/app/build.gradle* || true

          echo "Checking Android SDK installation:"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screens
        run: dart run flutter_native_splash:create

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Clean previous build outputs
        run: flutter clean

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIPPEDDON-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: ZIPPEDDON iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate artwork
        run: python scripts/generate_assets.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS platform scaffolding
        run: |
          flutter create \
            --platforms=android,ios \
            --org com.anonymousbeta \
            .

      - name: Verify generated platforms
        run: |
          test -d android
          test -d ios/Runner
          test -d ios/Runner/Assets.xcassets/AppIcon.appiconset

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screens
        run: dart run flutter_native_splash:create

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Verify iOS app
        run: |
          test -d build/ios/iphoneos/Runner.app
          ls -ld build/ios/iphoneos/Runner.app

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: ZIPPEDDON-iOS-App
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
