name: ZIPPEDDON Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate artwork
        run: python scripts/generate_assets.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS platform scaffolding
        run: |
          flutter create \
            --platforms=android,ios \
            --org com.anonymousbeta \
            .

      - name: Install Android API 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Configure Android compile SDK 36
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle_file = next(
              (path for path in candidates if path.is_file()),
              None
          )

          if gradle_file is None:
              print("ERROR: Android app Gradle file was not generated.")
              sys.exit(1)

          content = gradle_file.read_text(encoding="utf-8")

          pattern = re.compile(
              r"(?m)^([ \t]*compileSdk(?:Version)?\b[ \t]*=?[ \t]*)"
              r"(?:flutter\.compileSdkVersion|\d+)"
              r"([ \t]*(?://.*)?$)"
          )

          updated, replacements = pattern.subn(
              r"\g<1>36\g<2>",
              content
          )

          if replacements == 0:
              print("ERROR: Could not find the compileSdk setting.")
              print("Gradle file:", gradle_file)
              print(content)
              sys.exit(1)

          gradle_file.write_text(updated, encoding="utf-8")

          print("Updated:", gradle_file)
          print("compileSdk is now 36.")

          if not re.search(
              r"(?m)^[ \t]*compileSdk(?:Version)?\b[ \t]*=?[ \t]*36\b",
              updated
          ):
              print("ERROR: compileSdk 36 verification failed.")
              sys.exit(1)
          PY

      - name: Verify generated Android and iOS directories
        run: |
          test -d android/app
          test -d ios/Runner
          test -d ios/Runner/Assets.xcassets/AppIcon.appiconset
          grep -nE 'compileSdk(Version)?[[:space:]]*=?[[:space:]]*36' \
            android/app/build.gradle* 

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screens
        run: dart run flutter_native_splash:create

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIPPEDDON-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate artwork
        run: python scripts/generate_assets.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform scaffolding
        run: |
          flutter create \
            --platforms=ios \
            --org com.anonymousbeta \
            .

      - name: Verify iOS icon directory
        run: |
          test -d ios/Runner/Assets.xcassets/AppIcon.appiconset

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screens
        run: dart run flutter_native_splash:create

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: ZIPPEDDON-iOS-App
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error