
name: ZIPPEDDON Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate artwork
        run: python scripts/generate_assets.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS platform scaffolding
        run: |
          flutter create \
            --platforms=android,ios \
            --org com.anonymousbeta \
            .

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Configure Android compile SDK 36
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle_file = next(
              (p for p in candidates if p.is_file()),
              None,
          )

          if gradle_file is None:
              sys.exit("ERROR: Android app Gradle file not found.")

          content = gradle_file.read_text(encoding="utf-8")

          pattern = re.compile(
              r"(?m)^([ \t]*compileSdk(?:Version)?\b[ \t]*=?[ \t]*)"
              r"(?:flutter\.compileSdkVersion|\d+)"
              r"([ \t]*(?://.*)?$)"
          )

          updated, count = pattern.subn(
              r"\g<1>36\g<2>",
              content,
          )

          if count == 0:
              sys.exit(
                  "ERROR: Could not update compileSdk to 36. "
                  "Inspect the generated Gradle file."
              )

          gradle_file.write_text(updated, encoding="utf-8")

          if not re.search(
              r"(?m)^[ \t]*compileSdk(?:Version)?\b"
              r"[ \t]*=?[ \t]*36\b",
              updated,
          ):
              sys.exit("ERROR: compileSdk 36 verification failed.")

          print(f"Configured {gradle_file} to use compileSdk 36.")
          PY

      - name: Verify generated Android project
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle.kts -o \
               -f android/app/build.gradle

          grep -nE \
            'compileSdk(Version)?[[:space:]]*=?[[:space:]]*36' \
            android/app/build.gradle*

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screens
        run: dart run flutter_native_splash:create

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIPPEDDON-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate artwork
        run: python scripts/generate_assets.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS platform scaffolding
        run: |
          flutter create \
            --platforms=android,ios \
            --org com.anonymousbeta \
            .

      - name: Verify generated platform directories
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -d ios/Runner
          test -d ios/Runner/Assets.xcassets/AppIcon.appiconset

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screens
        run: dart run flutter_native_splash:create

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Verify iOS app
        run: |
          test -d build/ios/iphoneos/Runner.app
          ls -ld build/ios/iphoneos/Runner.app

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: ZIPPEDDON-iOS-App
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
